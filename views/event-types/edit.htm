<check if="{{ @errors }}">
    <div class="alert" role="alert">
        <div class="alert-icon">⚠️</div>
        <div class="alert-body">
            <div class="alert-title">خطا در ثبت اطلاعات</div>
            <ul class="alert-list">
                <repeat group="@errors" key="@field" value="@message">
                    <li>{{ @message }}</li>
                </repeat>
            </ul>
        </div>
        <button type="button" class="alert-close" onclick="this.closest('.alert').remove()">×</button>
    </div>
</check>

<div class="dialog">
    <div class="dialog-titlebar">
        <span class="dialog-title">
            <check if="{{ @action == 'edit' }}">
                🗂️ ویرایش نوع رویداد
            <false>
                🗂️ اضافه کردن نوع رویداد جدید
            </check>
        </span>
        <a href="/event-types" class="dialog-close" title="بستن">×</a>
    </div>
    <form method="POST" action="{{ @form_action }}" class="dialog-body" novalidate>
        <div class="form-row">
            <div class="form-group {{ @errors.name ?? '' ? 'has-error' : '' }}">
                <label>نام نوع رویداد:</label>
                <input type="text" name="name" value="{{ @old.name ?? (@item.name ?? '') }}" required>
                <check if="{{ @errors.name ?? '' }}">
                    <span class="field-error">{{ @errors.name }}</span>
                </check>
            </div>
            <div class="form-group {{ @errors.default_score ?? '' ? 'has-error' : '' }}">
                <label>امتیاز پیش‌فرض:</label>
                <input type="number" name="default_score" value="{{ @old.default_score ?? (@item.default_score ?? 0) }}" min="-100" max="100" required>
                <check if="{{ @errors.default_score ?? '' }}">
                    <span class="field-error">{{ @errors.default_score }}</span>
                </check>
                <small class="form-hint">عدد مثبت برای رفتار مثبت، عدد منفی برای رفتار منفی</small>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>توضیحات:</label>
                <textarea name="description">{{ @old.description ?? (@item.description ?? '') }}</textarea>
            </div>
        </div>
        <div class="dialog-buttons">
            <button type="submit" class="btn btn-success">
                <check if="{{ @action == 'edit' }}">به‌روزرسانی<false>ثبت</false></check>
            </button>
            <a href="/event-types" class="btn btn-outline-secondary">لغو</a>
        </div>
    </form>
</div>
