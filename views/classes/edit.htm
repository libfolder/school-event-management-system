<check if="{{ @errors }}">
    <div class="alert" role="alert">
        <div class="alert-icon">⚠️</div>
        <div class="alert-body">
            <div class="alert-title">خطا در ثبت اطلاعات</div>
            <ul class="alert-list">
                <repeat group="@errors" key="@field" value="@message">
                    <li>{{ @message }}</li>
                </repeat>
            </ul>
        </div>
        <button type="button" class="alert-close" onclick="this.closest('.alert').remove()">×</button>
    </div>
</check>

<div class="dialog">
    <div class="dialog-titlebar">
        <span class="dialog-title">
            <check if="{{ @action == 'edit' }}">
                🗂️ ویرایش کلاس
            <false>
                🗂️ اضافه کردن کلاس جدید
            </check>
        </span>
        <a href="/classes" class="dialog-close" title="بستن">×</a>
    </div>
    <form method="POST" action="{{ @form_action }}" class="dialog-body" novalidate>
        <div class="form-row">
            <div class="form-group {{ @errors.name ?? '' ? 'has-error' : '' }}">
                <label>نام کلاس:</label>
                <input type="text" name="name" value="{{ @old.name ?? (@class.name ?? '') }}" required>
                <check if="{{ @errors.name ?? '' }}">
                    <span class="field-error">{{ @errors.name }}</span>
                </check>
            </div>
            <div class="form-group {{ @errors.grade ?? '' ? 'has-error' : '' }}">
                <label>پایه:</label>
                <input type="number" name="grade" value="{{ @old.grade ?? (@class.grade ?? '') }}" min="1" max="12" required>
                <check if="{{ @errors.grade ?? '' }}">
                    <span class="field-error">{{ @errors.grade }}</span>
                </check>
            </div>
            <div class="form-group {{ @errors.section ?? '' ? 'has-error' : '' }}">
                <label>بخش:</label>
                <input type="text" name="section" value="{{ @old.section ?? (@class.section ?? '') }}" maxlength="10" required>
                <check if="{{ @errors.section ?? '' }}">
                    <span class="field-error">{{ @errors.section }}</span>
                </check>
            </div>
        </div>
        <div class="dialog-buttons">
            <button type="submit" class="btn btn-success">
                <check if="{{ @action == 'edit' }}">به‌روزرسانی<false>ثبت</false></check>
            </button>
            <a href="/classes" class="btn btn-outline-secondary">لغو</a>
        </div>
    </form>
</div>
