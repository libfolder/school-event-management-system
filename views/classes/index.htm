<div class="card">
    <div class="card-header">
        فهرست کلاس‌ها
        <a href="/classes/create" class="btn btn-success btn-sm">＋ اضافه کردن کلاس</a>
    </div>
    <div class="card-body">
        <check if="{{ count(@classes) }}">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>نام کلاس</th>
                        <th>پایه</th>
                        <th>بخش</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody>
                    <repeat group="@classes" value="@cls">
                    <tr>
                        <td>{{ @cls.id }}</td>
                        <td>
                            <a href="/classes/{{ @cls.id }}/students" title="نمایش دانش‌آموزان این کلاس">{{ @cls.name }}</a>
                            <span class="class-student-count">({{ @cls.student_count }} دانش‌آموز)</span>
                        </td>
                        <td>{{ @cls.grade }}</td>
                        <td>{{ @cls.section }}</td>
                        <td>
                            <a href="/classes/{{ @cls.id }}/edit" class="btn btn-sm btn-primary">ویرایش</a>
                            <a href="/classes/{{ @cls.id }}/delete" class="btn btn-sm btn-danger" onclick="return confirm('آیا مطمئن هستید؟')">حذف</a>
                        </td>
                    </tr>
                    </repeat>
                </tbody>
            </table>
        <false>
            <p class="empty-state">هیچ کلاسی ثبت نشده است.</p>
        </check>
    </div>
</div>
