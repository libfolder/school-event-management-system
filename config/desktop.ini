; Desktop settings for the Windows 98 - Maple Edition theme
; Context menu shown when right-clicking the desktop background.

[desktop]
; Application display name shown in the properties dialog
name = سیستم مدیریت رویدادهای مدرسه

[context_menu]
; Menu entries use flat keys: item_N_field
; Fields per entry:
;   type  = link | action | separator
;   label = display text
;   icon  = emoji shown before the label
;   href  = internal URL for type "link"
;   action = js action for type "action":
;            properties  = opens the properties dialog
;            toggle_icons = show or hide desktop icons
; Entries are rendered in ascending numeric order.
; "separator" entries need only the type field.

item_1_type = link
item_1_label = صفحه اصلی
item_1_icon = 🏠
item_1_href = /

